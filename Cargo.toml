[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["xzeldon <contact@zeldon.ru>"]

[workspace.dependencies]
# Communicate with HID devices
hidapi = "2.6.4"

# Error types for libraries
thiserror = "2"

# Logging facade
log = "0.4.29"

# Logging to rotating files in the per-user log directory
flexi_logger = { version = "0.31.10", default-features = false }

# Error handling in the binary
anyhow = "1"

# Command line parsing
clap = { version = "4.6.7", features = ["derive"] }

# Config file and JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Standard per-user config and log directories
directories = "6"

# The Razer HID library of this workspace
razer-hid = { path = "crates/razer-hid", version = "0.5.0" }

# Event Loop and Tray Icon
tao = "0.35.3"
tray-icon = "0.24.1"

# Image manipulation
image = "0.25.9"

# Windows API
winapi = { version = "0.3.9", features = ["winuser", "wincon", "consoleapi"] }

# Desktop notifications
notify-rust = "4.11.7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
# AGENTS.md writes a two-arm choice on a bool as `match flag { true => …, false => … }`.
match_bool = "allow"

# Slower builds, faster executables
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Faster builds, slower executables
[profile.dev]
opt-level = 0
lto = false
incremental = true
codegen-units = 16
