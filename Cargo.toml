[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.3.0"
license = "MIT"
repository = "https://github.com/xzeldon/razer-battery-report"
edition = "2024"
authors = ["xzeldon <timofey@z4n.me>"]

[workspace.dependencies]
# Communicate with HID devices
hidapi = "2.6.7"

# Error types for libraries
thiserror = "2"

# Logging facade
log = "0.4.34"

# Logging to rotating files in the per-user log directory
flexi_logger = { version = "0.31.10", default-features = false }

# Error handling in the binary
anyhow = "1"

# Command line parsing
clap = { version = "4.6.7", features = ["derive"] }

# Config file and JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Standard per-user config and log directories
directories = "6"

# The Razer HID library of this workspace
razer-hid = { path = "crates/razer-hid" }

# Event Loop and Tray Icon
tao = "0.37.1"
tray-icon = "0.26.1"

# Build script: renders the Lucide SVG sources into tray icon masks (no text, fonts or raster images)
resvg = { version = "0.48.1", default-features = false }

# Build script: compiles the Windows resource script (app icon, manifest)
embed-resource = "3.0.12"

# Windows API: console, registry, theme and DPI queries of the platform layer
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Start at login (per-user registry Run key on Windows)
auto-launch = "0.6.0"

# Open the log file with the default program
opener = "0.9.0"

# Desktop notifications
notify-rust = "4.18.2"

# Self-update: HTTPS client on the OS's own TLS stack (Schannel on Windows)
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }

# Self-update: version comparison, download digest and replacing the running executable
semver = "1"
sha2 = "0.11"
self-replace = "1.5"

# Self-update: Windows toasts with buttons
tauri-winrt-notification = "0.8.1"

# Profiling builds only: Tracy instrumentation, see the profile-with-tracy features.
# 0.19 speaks the protocol of the Tracy v0.14.1 profiler.
tracy-client = { version = "0.19.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
match_bool = "allow"

# Slower builds, faster executables
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Release code with line tables, so profilers can map samples to source lines
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Faster builds, slower executables
[profile.dev]
opt-level = 0
lto = false
incremental = true
codegen-units = 16
