[package]
name = "razer-battery-report"
version = "0.3.1"
authors = ["xzeldon <contact@zeldon.ru>"]
edition = "2021"
description = "Razer Battery Level Tray Indicator"

# Slower builds, faster executables
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Faster builds, slower executables
[profile.dev]
opt-level = 0
lto = false
incremental = true
codegen-units = 16

[dependencies]
# Logging & Error Handling
log = "0.4.29"
flexi_logger = "0.31.7"
anyhow = "1.0"

# Configuration, Data & CLI
serde = { version = "1.0", features = ["derive"] }
confy = "2.0.0"
directories = "6.0.0"
clap = { version = "4.5.54", features = ["derive"] }

# UI & Desktop Integration
tao = "0.34.5"
tray-icon = "0.21.3"
notify-rust = "4.11.7"
auto-launch = "0.5.0"

# Hardware & Media
hidapi = "2.6.4"
image = "0.25.9"

# Windows specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }
