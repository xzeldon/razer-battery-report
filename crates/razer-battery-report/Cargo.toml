[package]
name = "razer-battery-report"
description = "Razer Battery Level Tray Indicator"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = ["self-update"]
# Checks GitHub for new releases and installs them from the tray; packagers turn it off.
self-update = ["dep:ureq", "dep:semver", "dep:sha2", "dep:self-replace", "dep:tauri-winrt-notification"]
# Tracy profiling, never in releases; collects data from start-up on. Listens on localhost only.
profile-with-tracy = ["dep:tracy-client", "tracy-client/default", "tracy-client/only-localhost"]
# Collects data only while the Tracy profiler is connected.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand"]
# Also records every allocation with its call stack.
profile-with-tracy-allocations = ["profile-with-tracy"]

[dependencies]
anyhow.workspace = true
auto-launch.workspace = true
clap.workspace = true
directories.workspace = true
flexi_logger.workspace = true
log.workspace = true
notify-rust.workspace = true
opener.workspace = true
razer-hid.workspace = true
self-replace = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tao.workspace = true
toml.workspace = true
tracy-client = { workspace = true, optional = true }
tray-icon.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = { workspace = true, optional = true }
windows-sys.workspace = true

[build-dependencies]
embed-resource.workspace = true
resvg.workspace = true

[lints]
workspace = true
