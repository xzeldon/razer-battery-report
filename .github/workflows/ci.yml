name: CI

# A manual run ignores `paths` and always builds; its exe is attached for testing a branch.
on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "assets/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml; rust-cache keys on its version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --package razer-battery-report
      - name: Short sha
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: razer-battery-report-${{ steps.sha.outputs.short }}-x86_64-pc-windows-msvc
          path: target/release/razer-battery-report.exe
          if-no-files-found: error

