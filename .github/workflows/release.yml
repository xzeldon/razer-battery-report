name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  notices:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - run: python3 scripts/generate-notices.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY.md
          if-no-files-found: error

  build:
    needs: notices
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      # No rust-cache: a release is built from scratch, never from a cache a PR could have written.
      - run: cargo build --release --locked --package razer-battery-report
        env:
          # Embedded into the exe for the tray's About > Licenses.
          THIRD_PARTY_NOTICES: ${{ github.workspace }}/notices/THIRD-PARTY.md
      - name: Name the exe after the release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp target/release/razer-battery-report.exe "dist/razer-battery-report-$TAG-x86_64-pc-windows-msvc.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Immutable releases take no assets once published, so the release starts as a draft. A
      # re-run finds the draft of a failed attempt and finishes it.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes
          fi
          case "$TAG" in
            *-*) flags=(--prerelease --latest=false) ;;
            *) flags=(--prerelease=false --latest) ;;
          esac
          gh release edit "$TAG" --draft=false "${flags[@]}"
